name: Release

# On main: opens or updates the "chore: version packages" PR from pending changesets.
# Merging that PR publishes to npm through trusted publishing (OIDC, with provenance).
# Stays off until the repository variable NPM_RELEASE is "on", which is set once the
# trusted publisher exists on npmjs.com, so no version PR waits around that cannot publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    # npm trusted publishing (OIDC) only works on GitHub-hosted runners.
    runs-on: ubuntu-latest
    if: vars.NPM_RELEASE == 'on'
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: changesets/action@v2
        with:
          version-script: npx changeset version
          publish-script: npx changeset publish
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
